body:
  text: 散見簡牘合輯河北定縣八角廊四十號漢墓竹簡儒家者言曰明主有三惧一曰聞其過二曰得志如恐不能行子贛問孔子曰賜為人下如不知為下孔子曰為人下者其猶土乎種得五穀焉厥之得甘泉焉草木植禽獸伏焉生人立焉死人入焉多其言為人下者其猶土乎曾折援木擊曾子者參得罪夫子得毋病乎退而就曰參來勿內也曾子自之未賞可得也小箠則待笞大怒立壹而不去殺身以父之民與殺天子之民者其罪伐陳西門因使其降民脩之二人子曰丘也桓公謂管仲曰諸侯管仲對曰非天子不出境桓公今予不道割燕君之所至如予之漁者曰天暑而得之不將祭之乎孔子曰閒處喟然歎曰銅鞮柏者周公旦聶天下之也夫有道乃天下於天下哉於大廟右陛之前有其口如名其背之為人也多言過多事多患也齊景公問子贛曰子誰乎子也公曰子知其聖長皆曰高高幾何襄子問中尼曰先生行見意先生之道固不通乎中襄子見子路曰吾嘗問先生先生不對即隱也隱安得為仁者不知得為聖子路曰今天下之鳴鍾如衝之以梃子曰犢主澤鳴晉國之賢聞君子重傷之匡間子欲殺陽虎孔子之孔子孔子舍子路怒奮欲下子止之曰何仁義之不意詩書不習禮樂不脩則是丘之罪陽虎如為陽虎則是非丘君子道四彊於行弱於辭何中尼曰新交取親路行辭於孔孔子孔子曰曾若以車乎言乎子路請以言孔子曰不彊不曾子有疾公猛義往問之曾子言曰鳥之將死也必有悲聲君子將卒也也曾子立志則貪欲之心止則怠隋曼易之節止君子張網者四面張如祝之者四方來者皆麗予欲左者左欲右者右欲高者高者下請受其犯命者陭之之曰湯之德及禽獸矣故吾𠦜餘國來服王居鄗使人治池得人曰賓之吏曰此毋主矣文王曰一家之主也長一國者一國長天下者天下之人聞之崔子公劫晏子於上曰子我將舍子子不我與將殺子可知晏子劫之其志非恿也也以非義也子何不誰之崔予舍之晏子其僕將馳晏子曰之安之成節之屈廬曰與我將舍子子不我與將殺子屈廬乎且吾聞臨死不怒夫人臣勝乃內其劍於魯如趨受臣敢不趨乎君之受敝卑臣敢故人主孝則名天下譽矣人臣孝則事君忠處置之子不敢撅也父母全之子不敢父母全而生之子惡言不出于口蕠言不反於已膚受諸父母曾子何謂身體髮膚弗敢毀傷曰樂正子毀傷父不子也士不友也尊榮無憂子道如此可胃孝教之所由曰孝經之且夫為人子親死然後事也子路曰然聞成人孔子曰何以為成人才子路曰由孔子曰由其可以林放問禮問告朔
